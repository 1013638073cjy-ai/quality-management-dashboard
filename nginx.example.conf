
server {
    listen 80;
    server_name example.com;

    # 修改为部署后实际的 dist 绝对路径
    root /var/www/quality-management-dashboard/dist;
    index index.html;

    # Vite 构建的静态资源包含内容哈希
    # 可以使用较长时间的强缓存
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HTML 入口不使用长期强缓存
    # 这样用户能够检查到新的构建版本
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        add_header Cache-Control "no-store";
    }

    # React Router history 路由支持
    location / {
        try_files $uri $uri/ /index.html;
    }
}
